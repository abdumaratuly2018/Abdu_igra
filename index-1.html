<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наша семья</title>
<style>
  :root { --bg:#fff4e0; --ink:#2b2d42; --card:#ffffff; --accent:#ef476f; --sun:#ffd166; --green:#06d6a0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Trebuchet MS",Verdana,sans-serif; padding:16px; }
  h1 { text-align:center; margin:8px 0 4px; font-size:1.8rem; }
  .sub { text-align:center; margin:0 0 16px; opacity:.75; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; max-width:520px; margin:0 auto; }
  .person { background:var(--card); border:0; border-radius:20px; padding:16px 8px; font:inherit; color:inherit;
    box-shadow:0 4px 0 rgba(0,0,0,.12); cursor:pointer; text-align:center; }
  .person:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .person:focus-visible, button:focus-visible, input:focus-visible { outline:3px solid var(--accent); }
  .emoji { font-size:2.6rem; display:block; }
  .name { font-weight:bold; font-size:1.1rem; display:block; margin-top:4px; }
  .stars { display:block; margin-top:4px; color:#b8860b; font-weight:bold; }
  .top { max-width:520px; margin:16px auto 0; background:var(--sun); border-radius:20px; padding:12px; text-align:center; font-weight:bold; }
  #panel { position:fixed; inset:0; background:var(--bg); padding:16px; overflow:auto; display:none; }
  #panel.open { display:block; }
  .inner { max-width:520px; margin:0 auto; }
  .back { background:var(--ink); color:#fff; border:0; border-radius:12px; padding:10px 16px; font:inherit; cursor:pointer; }
  .big { text-align:center; }
  .big .emoji { font-size:4rem; }
  .facts { background:var(--card); border-radius:16px; padding:12px 16px; margin:12px 0; }
  .task { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:14px; padding:12px; margin:8px 0; font-size:1.05rem; }
  .task input { width:26px; height:26px; accent-color:var(--green); }
  .task.done span { text-decoration:line-through; opacity:.55; }
  .add { display:flex; gap:8px; margin-top:12px; }
  .add input { flex:1; padding:12px; border-radius:12px; border:2px solid #ccc; font:inherit; }
  .add button { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 18px; font:inherit; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<h1>Наша семья</h1>
<p class="sub">Нажми на имя</p>
<div class="grid" id="grid"></div>
<div class="top" id="top"></div>

<div id="panel"><div class="inner" id="inner"></div></div>

<script>
// ✏️ ЗДЕСЬ МЕНЯЙ ИМЕНА И ВОЗРАСТ. Если возраст неизвестен — оставь "?"
const family = [
  { id:"mama",   name:"Мама",        emoji:"👩", age:"?", role:"Мама",            tasks:["Помочь с ужином","Обнять маму"] },
  { id:"papa",   name:"Папа",        emoji:"👨", age:"?", role:"Папа",            tasks:["Сходить в магазин","Обнять папу"] },
  { id:"brother1",name:"Старший брат",emoji:"🧑", age:"?", role:"Первый ребёнок",  tasks:["Сделать уроки"] },
  { id:"me",     name:"Абдурахман",  emoji:"🦸", age:8,   role:"Второй ребёнок",  tasks:["Сделать уроки","Убрать игрушки","Прочитать 10 страниц"] },
  { id:"brother2",name:"Братишка",    emoji:"🧒", age:"?", role:"Третий ребёнок",  tasks:["Собрать конструктор"] },
  { id:"sister", name:"Сестрёнка",   emoji:"👧", age:"?", role:"Четвёртый ребёнок",tasks:["Нарисовать рисунок"] }
];

let state = {};
try { state = JSON.parse(localStorage.getItem("familyState") || "{}"); } catch (e) {}
family.forEach(p => { if (!state[p.id]) state[p.id] = p.tasks.map(t => ({ text:t, done:false })); });

function save() { try { localStorage.setItem("familyState", JSON.stringify(state)); } catch (e) {} }
const stars = id => state[id].filter(t => t.done).length;
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function renderHome() {
  document.getElementById("grid").innerHTML = family.map(p =>
    `<button class="person" data-id="${p.id}"><span class="emoji">${p.emoji}</span>
     <span class="name">${esc(p.name)}</span><span class="stars">⭐ ${stars(p.id)}</span></button>`).join("");
  const best = [...family].sort((a, b) => stars(b.id) - stars(a.id))[0];
  const total = family.reduce((s, p) => s + stars(p.id), 0);
  document.getElementById("top").textContent = total === 0
    ? "Пока нет звёзд. Выполни первое задание!"
    : `Всего звёзд в семье: ${total}. Лидер: ${best.name} 🏆`;
  document.querySelectorAll(".person").forEach(b => b.onclick = () => openPerson(b.dataset.id));
}

function openPerson(id) {
  const p = family.find(x => x.id === id);
  const inner = document.getElementById("inner");
  inner.innerHTML = `
    <button class="back" id="back">← Назад</button>
    <div class="big"><span class="emoji">${p.emoji}</span><h2>${esc(p.name)}</h2></div>
    <div class="facts">Возраст: <b>${p.age}</b><br>Кто это: <b>${p.role}</b><br>Звёзд: <b>⭐ ${stars(id)}</b></div>
    <h3>Задания</h3>
    <div id="tasks"></div>
    <div class="add"><input id="newTask" placeholder="Новое задание" maxlength="60"><button id="addBtn">Добавить</button></div>`;
  const drawTasks = () => {
    document.getElementById("tasks").innerHTML = state[id].map((t, i) =>
      `<label class="task ${t.done ? "done" : ""}"><input type="checkbox" data-i="${i}" ${t.done ? "checked" : ""}><span>${esc(t.text)}</span></label>`).join("")
      || "<p>Заданий нет. Добавь первое!</p>";
    document.querySelectorAll("#tasks input").forEach(c => c.onchange = () => {
      state[id][+c.dataset.i].done = c.checked; save(); openPerson(id); renderHome();
    });
  };
  drawTasks();
  document.getElementById("back").onclick = () => { document.getElementById("panel").classList.remove("open"); renderHome(); };
  document.getElementById("addBtn").onclick = () => {
    const v = document.getElementById("newTask").value.trim();
    if (!v) return;
    state[id].push({ text:v, done:false }); save(); openPerson(id);
  };
  document.getElementById("panel").classList.add("open");
}

renderHome();
</script>
</body>
</html>
