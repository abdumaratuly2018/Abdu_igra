<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лови звёзды</title>
<style>
  :root { --bg:#14213d; --panel:#1d2d50; --star:#fca311; --player:#e5e5e5; --bomb:#e63946; --text:#f1f1f1; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: "Trebuchet MS", Verdana, sans-serif; display:flex; flex-direction:column;
    align-items:center; justify-content:center; touch-action:none; }
  h1 { margin:0 0 8px; font-size:1.4rem; }
  canvas { background:var(--panel); border-radius:12px; max-width:96vw; max-height:70vh; }
  p { margin:8px 0 0; opacity:.8; font-size:.9rem; text-align:center; }
  button { margin-top:10px; padding:10px 22px; font-size:1rem; border:0; border-radius:8px;
    background:var(--star); color:#14213d; font-weight:bold; cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; }
</style>
</head>
<body>
<h1>Лови звёзды</h1>
<canvas id="game" width="400" height="500"></canvas>
<p>Стрелки ← → или мышь/палец. Лови звёзды, избегай красных бомб.</p>
<button id="restart">Играть заново</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

let player, items, score, lives, over, spawnTimer, keys = {};

function reset() {
  player = { x: W / 2 - 30, y: H - 30, w: 60, h: 14, speed: 6 };
  items = [];
  score = 0;
  lives = 3;
  over = false;
  spawnTimer = 0;
}

function spawn() {
  const bomb = Math.random() < 0.3;
  items.push({
    x: 20 + Math.random() * (W - 40),
    y: -20,
    r: 12,
    bomb,
    vy: 2 + Math.random() * 2 + score * 0.02
  });
}

function update() {
  if (over) return;
  if (keys.ArrowLeft) player.x -= player.speed;
  if (keys.ArrowRight) player.x += player.speed;
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  if (++spawnTimer > 35) { spawn(); spawnTimer = 0; }

  for (const it of items) it.y += it.vy;

  items = items.filter(it => {
    const hit = it.y + it.r >= player.y && it.y - it.r <= player.y + player.h &&
                it.x >= player.x - it.r && it.x <= player.x + player.w + it.r;
    if (hit) {
      if (it.bomb) lives--; else score++;
      return false;
    }
    if (it.y > H + 20) {
      if (!it.bomb) lives--;
      return false;
    }
    return true;
  });

  if (lives <= 0) over = true;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--player");
  ctx.fillRect(player.x, player.y, player.w, player.h);

  for (const it of items) {
    ctx.fillStyle = it.bomb ? "#e63946" : "#fca311";
    ctx.beginPath();
    ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = "#f1f1f1";
  ctx.font = "18px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Счёт: " + score, 12, 26);
  ctx.textAlign = "right";
  ctx.fillText("Жизни: " + lives, W - 12, 26);

  if (over) {
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "32px sans-serif";
    ctx.fillText("Игра окончена", W / 2, H / 2 - 10);
    ctx.font = "20px sans-serif";
    ctx.fillText("Счёт: " + score, W / 2, H / 2 + 24);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

addEventListener("keydown", e => { keys[e.key] = true; if (e.key.startsWith("Arrow")) e.preventDefault(); });
addEventListener("keyup", e => { keys[e.key] = false; });

function pointerMove(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  player.x = Math.max(0, Math.min(W - player.w, x - player.w / 2));
}
canvas.addEventListener("mousemove", e => pointerMove(e.clientX));
canvas.addEventListener("touchmove", e => { pointerMove(e.touches[0].clientX); }, { passive: true });
canvas.addEventListener("touchstart", e => { pointerMove(e.touches[0].clientX); }, { passive: true });

document.getElementById("restart").addEventListener("click", reset);

reset();
loop();
</script>
</body>
</html>
